[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stateflow"
version = "0.2.0"
description = "State and prediction driven control plane for stateful agent infrastructure"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["stateflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
