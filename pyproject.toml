[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stateflow"
version = "0.5.0"
description = "Four-module state and action control plane for agent infrastructure"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
stateflow = "stateflow.interface.demo:main"

[tool.setuptools.packages.find]
include = ["stateflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
