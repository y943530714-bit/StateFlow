syntax = "proto3";

package stateflow.v1;

import "google/protobuf/timestamp.proto";

// The wire contract is intentionally metadata-first. Prompt bodies, tool
// results, and KV tensors stay in the data plane or are referenced by ID.
message AgentStateEvent {
  string event_type = 1;
  string session_id = 2;
  string task_id = 3;
  int64 turn_id = 4;
  string step_id = 5;
  string request_id = 6;
  string attempt_id = 7;
  string trace_id = 8;
  string source = 9;
  google.protobuf.Timestamp observed_at = 10;
  int64 epoch = 11;
  int64 sequence = 12;
  map<string, string> payload_json = 13;
  double confidence = 14;
  double ttl_seconds = 15;
  bool authoritative = 16;
}

message RoutingDecision {
  string decision_id = 1;
  string selected_model = 2;
  string selected_endpoint = 3;
  string selected_replica = 4;
  double predicted_success = 5;
  double predicted_cost = 6;
  double predicted_latency_seconds = 7;
  string decision_reason = 8;
  string scheduler_version = 9;
  string state_id = 10;
  int64 state_version = 11;
  repeated string override_reasons = 12;
  bool fallback = 13;
  google.protobuf.Timestamp timestamp = 14;
}

enum SourceAuthority {
  SOURCE_AUTHORITY_LOG_HINT = 0;
  SOURCE_AUTHORITY_DERIVED = 1;
  SOURCE_AUTHORITY_DIRECT_TELEMETRY = 2;
  SOURCE_AUTHORITY_STRUCTURED_LIFECYCLE = 3;
  SOURCE_AUTHORITY_AUTHORITATIVE_DOMAIN = 4;
}

message ComponentDescriptor {
  string component_id = 1;
  string kind = 2;
  string implementation = 3;
  string version = 4;
  repeated string schema_versions = 5;
  repeated string produces_state = 6;
  repeated string consumes_state = 7;
  repeated string produces_metrics = 8;
  repeated string consumes_metrics = 9;
  repeated string manages_types = 10;
  repeated string relation_capabilities = 11;
  string update_mode = 12;
  string endpoint = 13;
}

message CorrelationIdentity {
  string trace_id = 1;
  string span_id = 2;
  string agent_id = 3;
  string session_id = 4;
  string request_id = 5;
  string action_id = 6;
  string component_id = 7;
  string instance_id = 8;
}

message CanonicalStateUpdate {
  string entity_ref = 1;
  string key = 2;
  string typed_value_json = 3;
  string producer = 4;
  google.protobuf.Timestamp timestamp = 5;
  int64 ttl_ms = 6;
  SourceAuthority authority = 7;
  int64 version = 8;
  string semantic = 9;
  double confidence = 10;
  string source_ref = 11;
  CorrelationIdentity correlation = 12;
  int64 expected_version = 13;
  string idempotency_key = 14;
}

message MetricSample {
  string entity_ref = 1;
  string metric_key = 2;
  double value = 3;
  string unit = 4;
  string producer = 5;
  google.protobuf.Timestamp timestamp = 6;
  map<string, string> labels = 7;
  CorrelationIdentity correlation = 8;
}

message CanonicalEvent {
  string event_id = 1;
  string event_type = 2;
  string subject_ref = 3;
  string producer = 4;
  google.protobuf.Timestamp timestamp = 5;
  CorrelationIdentity correlation = 6;
  string payload_json = 7;
  string source_ref = 8;
}

message Heartbeat {
  string subject_ref = 1;
  string producer = 2;
  string source_watermark = 3;
  string schema_version = 4;
  google.protobuf.Timestamp timestamp = 5;
  int64 ttl_ms = 6;
}

message GraphEntity {
  string ref = 1;
  string graph = 2;
  string entity_type = 3;
  string lifecycle = 4;
  string owner_component_ref = 5;
  string parent_ref = 6;
  map<string, string> labels = 7;
  string schema_version = 8;
}

message RelationUpdate {
  string source_ref = 1;
  string relation_type = 2;
  string target_ref = 3;
  string producer = 4;
  google.protobuf.Timestamp timestamp = 5;
  SourceAuthority authority = 6;
  string attributes_json = 7;
  int64 ttl_ms = 8;
  int64 version = 9;
  int64 expected_version = 10;
  string idempotency_key = 11;
}

message SnapshotRequest {
  repeated string entities = 1;
  repeated string keys = 2;
  map<string, int64> max_age_ms = 3;
  SourceAuthority min_authority = 4;
  bool include_relations = 5;
}

message CanonicalStateValue {
  string entity_ref = 1;
  string key = 2;
  string typed_value_json = 3;
  string producer = 4;
  google.protobuf.Timestamp timestamp = 5;
  int64 ttl_ms = 6;
  SourceAuthority authority = 7;
  int64 version = 8;
  string semantic = 9;
  double confidence = 10;
  string source_ref = 11;
  CorrelationIdentity correlation = 12;
}

message StateSnapshot {
  string token = 1;
  int64 logical_time = 2;
  google.protobuf.Timestamp created_at = 3;
  double completeness = 4;
  repeated CanonicalStateValue values = 5;
  repeated RelationUpdate relations = 6;
  repeated string missing = 7;
  repeated string stale = 8;
}

message CandidateAction {
  string candidate_id = 1;
  string action_type = 2;
  string target_component = 3;
  string parameters_json = 4;
}

message CandidatePrediction {
  string prediction_id = 1;
  string snapshot_id = 2;
  string candidate_id = 3;
  string performance_json = 4;
  string reliability_json = 5;
  string cost_json = 6;
  string future_state_json = 7;
  double confidence = 8;
  string model_version = 9;
  string applicability = 10;
  string fallback = 11;
}

message Action {
  string action_id = 1;
  string target_component = 2;
  string action_type = 3;
  string parameters_json = 4;
  string preconditions_json = 5;
  string idempotency_key = 6;
  double timeout_seconds = 7;
  string rollback_action_json = 8;
  bool dry_run = 9;
}

message DecisionRecord {
  string decision_id = 1;
  string snapshot_id = 2;
  string policy_version = 3;
  repeated string candidate_ids = 4;
  repeated string prediction_ids = 5;
  repeated string model_versions = 6;
  Action selected_action = 7;
  string reason = 8;
  repeated string constraints = 9;
  google.protobuf.Timestamp timestamp = 10;
}

message Outcome {
  string action_id = 1;
  string status = 2;
  google.protobuf.Timestamp started_at = 3;
  google.protobuf.Timestamp completed_at = 4;
  double actual_latency_seconds = 5;
  double actual_cost = 6;
  bool actual_success = 7;
  string resource_delta_json = 8;
  string error = 9;
}

message Feedback {
  string feedback_id = 1;
  string decision_id = 2;
  string action_id = 3;
  string prediction_id = 4;
  Outcome outcome = 5;
  string prediction_error_json = 6;
  string policy_kpis_json = 7;
  string calibration_sample_json = 8;
  string replay_pointer = 9;
  google.protobuf.Timestamp timestamp = 10;
}

// The State Plane RPC surface reuses the canonical JSON payload accepted by
// StatePlaneAPI. This keeps HTTP and gRPC semantics aligned while typed state
// values and extensible graph attributes continue to evolve.
message StatePlaneRpcRequest {
  string payload_json = 1;
  map<string, string> query = 2;
}

message StatePlaneRpcResponse {
  int32 status_code = 1;
  string payload_json = 2;
}

message WatchStateRequest {
  int64 after_cursor = 1;
  string entity_prefix = 2;
  repeated string keys = 3;
  int32 batch_size = 4;
  bool follow = 5;
  int32 poll_interval_ms = 6;
}

message StateChange {
  int64 cursor = 1;
  string kind = 2;
  string subject_ref = 3;
  string key_or_relation = 4;
  int64 version = 5;
  google.protobuf.Timestamp timestamp = 6;
}

service StatePlaneService {
  rpc RegisterComponent(StatePlaneRpcRequest) returns (StatePlaneRpcResponse);
  rpc UpsertEntities(StatePlaneRpcRequest) returns (StatePlaneRpcResponse);
  rpc PublishState(StatePlaneRpcRequest) returns (StatePlaneRpcResponse);
  rpc PublishMetrics(StatePlaneRpcRequest) returns (StatePlaneRpcResponse);
  rpc PublishEvents(StatePlaneRpcRequest) returns (StatePlaneRpcResponse);
  rpc UpsertRelations(StatePlaneRpcRequest) returns (StatePlaneRpcResponse);
  rpc Heartbeat(StatePlaneRpcRequest) returns (StatePlaneRpcResponse);
  rpc GetState(StatePlaneRpcRequest) returns (StatePlaneRpcResponse);
  rpc GetSnapshot(StatePlaneRpcRequest) returns (StatePlaneRpcResponse);
  rpc ReadSnapshot(StatePlaneRpcRequest) returns (StatePlaneRpcResponse);
  rpc QueryGraph(StatePlaneRpcRequest) returns (StatePlaneRpcResponse);
  rpc QueryMetrics(StatePlaneRpcRequest) returns (StatePlaneRpcResponse);
  rpc GetFreshness(StatePlaneRpcRequest) returns (StatePlaneRpcResponse);
  rpc ListSchema(StatePlaneRpcRequest) returns (StatePlaneRpcResponse);
  rpc ListComponents(StatePlaneRpcRequest) returns (StatePlaneRpcResponse);
  rpc ListHeartbeats(StatePlaneRpcRequest) returns (StatePlaneRpcResponse);
  rpc WatchState(WatchStateRequest) returns (stream StateChange);
}
